<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Aplikasi Split Bill</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 40px; }
    .card { max-width: 400px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .result { margin-top: 20px; padding: 15px; background-color: #e9f5ff; border-radius: 5px; border-left: 5px solid #007bff; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kalkulator Split Bill</h2>
    
    <div class="input-group">
      <label>Total Tagihan (Rp):</label>
      <input type="number" id="total" placeholder="Contoh: 150000">
    </div>

    <div class="input-group">
      <label>Jumlah Orang:</label>
      <input type="number" id="jumlahOrang" placeholder="Contoh: 3">
    </div>

    <button onclick="hitung()">Hitung Pembagian</button>

    <div class="result" id="hasil" style="display: none;">
      <h3 style="margin-top:0;">Hasil:</h3>
      <p id="teksHasil"></p>
    </div>
  </div>

  <script>
    function hitung() {
      var total = document.getElementById('total').value;
      var orang = document.getElementById('jumlahOrang').value;

      if (!total || !orang || orang <= 0) {
        alert('Harap masukkan total tagihan dan jumlah orang yang benar!');
        return;
      }

      var perOrang = total / orang;
      
      document.getElementById('teksHasil').innerHTML = 
        'Masing-masing bayar: <b>Rp ' + Number(perOrang).toLocaleString('id-ID') + '</b>';
      document.getElementById('hasil').style.display = 'block';
    }
  </script>

</body>
</html>
